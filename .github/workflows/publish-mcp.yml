name: Publish to MCP Registry

# Build each MCP server as an OCI image on ghcr.io (verified by the
# io.modelcontextprotocol.server.name LABEL), then publish its server.json to the
# official MCP Registry using GitHub OIDC (no stored secret needed for io.github.* names).
#
# Trigger: push a version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
# (or run manually via "Run workflow" and supply a version).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  publish:
    # Only the CyberPunk11147 repo owns the io.github.CyberPunk11147/* registry namespace (OIDC).
    # The cyberwareX mirror gets the same tags and must NOT try to publish (403 + failure emails, 2026-09-10).
    if: github.repository_owner == 'CyberPunk11147'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for mcp-publisher (proves the io.github.<owner> namespace)
      contents: read
      packages: write    # push images to ghcr.io with GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        server: [defi-oracle, chain-data, web-access, wallet-safety]
        # voice-stt left the matrix 2026-11-06: the service was retired 2026-10-18 (deprecate-voice.yml)
        # council is NOT here: it is published from the cyberwareX repo under the
        # io.github.cyberwareX/* namespace by publish-council.yml, because that is the
        # namespace this org's OIDC actually owns. One server, one publishing owner.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive version + lowercase owner
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (marker as MANIFEST annotation, not just a config label)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.server }}
          push: true
          provenance: false   # keep a single image manifest so the annotation lands where the registry reads it
          sbom: false
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/cyberwarex-${{ matrix.server }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/cyberwarex-${{ matrix.server }}:latest
          annotations: |
            io.modelcontextprotocol.server.name=io.github.CyberPunk11147/cyberwarex-${{ matrix.server }}

      - name: Pin version + image tag into server.json
        run: |
          cd "${{ matrix.server }}"
          V="${{ steps.meta.outputs.version }}"
          jq --arg v "$V" '.version=$v | .packages[0].identifier = (.packages[0].identifier | sub(":[^:/]+$"; ":"+$v))' server.json > s.tmp && mv s.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          cd "${{ matrix.server }}"
          ../mcp-publisher publish
